server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /chat {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
    }

    location /history {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
    }

    location /sessions {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
    }

    location /archive {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
    }

    location /auth {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
    }
}
