services:
  backend:
    build:
      context: .
      dockerfile: BE/Dockerfile
    env_file: .env
    network_mode: host
    environment:
      - OLLAMA_BASE_URL=http://localhost:11434
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/history?session_id=health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: FE/Dockerfile
    network_mode: host
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
